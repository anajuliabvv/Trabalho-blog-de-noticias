<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Blog</h1>
  </header>

  <div id="message" class="message hidden"></div>

  <main>
    <section id="posts-section">
      <h2>Posts</h2>

      <form id="post-form">
        <input type="hidden" id="post-id">
        <label for="post-title">Title</label>
        <input type="text" id="post-title" required>

        <label for="post-writer">Writer</label>
        <select id="post-writer" required></select>

        <label for="post-content">Content</label>
        <textarea id="post-content" required></textarea>
        <p id="word-count" class="counter">0 / 500 words</p>

        <button type="submit" id="post-submit">Publish post</button>
        <button type="button" id="post-cancel" class="secondary hidden">Cancel edit</button>
      </form>

      <form id="search-form" class="inline-form">
        <input type="text" id="search-input" placeholder="Search posts">
        <button type="submit">Search</button>
        <button type="button" id="search-clear" class="secondary">Clear</button>
      </form>

      <label for="reader-select">Reading as</label>
      <select id="reader-select"></select>

      <div id="post-list"></div>
    </section>

    <section id="writers-section">
      <h2>Writers</h2>
      <form id="writer-form">
        <label for="writer-name">Name</label>
        <input type="text" id="writer-name" required>
        <label for="writer-email">Email</label>
        <input type="email" id="writer-email" required>
        <button type="submit">Add writer</button>
      </form>
      <div id="writer-list"></div>
    </section>

    <section id="readers-section">
      <h2>Readers</h2>
      <form id="reader-form">
        <label for="reader-name">Name</label>
        <input type="text" id="reader-name" required>
        <label for="reader-email">Email</label>
        <input type="email" id="reader-email" required>
        <button type="submit">Add reader</button>
      </form>
      <div id="reader-list"></div>
    </section>
  </main>

  <footer>
    <p>Blog API</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
